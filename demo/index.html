<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="设计竞赛发现、规则解析与任务书整理。"><title>设计竞赛检索与规则解析</title></head><body>
<header><a class="brand" href="/">◒ <span>DESIGN SCOUT<small>设计竞赛检索与规则解析</small></span></a><a href="https://github.com/FeyZha/design-competition-agent" target="_blank" rel="noreferrer">项目源码 ↗</a></header>
<main><section class="intro"><p class="eyebrow">FIND YOUR NEXT BRIEF</p><h1>把规则读清楚，<br><em>再开始好设计。</em></h1><p>发现赛事，分清独立投稿方向，让创作从一份明确的任务书开始。</p><div class="note" role="note">预制数据演示 · 已保存的历史赛事快照，不代表当前仍可报名。请以官方规则为准。</div></section>
<section class="workspace"><aside><p class="eyebrow">测试场景</p><nav id="scenarios" aria-label="预制测试场景"><button data-scenario="all" aria-pressed="true">全部赛事 <span>01</span></button><button data-scenario="poster">海报方向 <span>02</span></button><button data-scenario="bound">绑定交付材料 <span>03</span></button><button data-scenario="empty">无匹配结果 <span>04</span></button></nav><label>作品类型<select id="type"><option value="">全部类型</option></select></label><label class="check"><input type="checkbox" id="ai">只看明确允许 AI</label><p class="aside-note">选择方向后查看资格、费用、AI 规则及来源；任务书保持原始交付要求。</p><p id="snapshot"></p></aside>
<div class="results"><div class="toolbar"><h2>发现机会 <small id="count"></small></h2><label><span class="sr-only">搜索赛事与主题</span><input id="search" type="search" placeholder="搜索赛事、主题或任务…"></label></div><div id="list" aria-live="polite"><p>正在读取已保存的赛事…</p></div></div></section></main>
<dialog id="detail" aria-labelledby="detail-title"><div class="dialog-head"><span class="eyebrow">COMPETITION BRIEF</span><button id="close" aria-label="关闭详情">关闭 ×</button></div><h2 id="detail-title"></h2><div id="detail-body"></div><label id="choice-label">选择本次创作类别<select id="choice"></select></label><button class="primary" id="download">下载本方向任务书 ↓</button><p id="download-status" role="status"></p></dialog><footer>DESIGN SCOUT · 从信息到明确任务 <span>预制结果，无大模型调用</span></footer><script type="module" src="/src/main.ts"></script></body></html>
